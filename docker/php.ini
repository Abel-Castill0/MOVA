; MOVA — overrides de producción sobre la config por defecto de FrankenPHP.
expose_php = Off
short_open_tag = Off
memory_limit = 256M
; Avatares: validación Laravel max:4096 KB → margen para multipart.
upload_max_filesize = 8M
post_max_size = 12M

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; El código no cambia dentro de una imagen: no revalidar timestamps.
opcache.validate_timestamps = 0
