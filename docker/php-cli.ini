; MOVA — ajustes SOLO para el CLI de PHP (php artisan ...). PHP los carga como `php-cli.ini`;
; el servidor web (FrankenPHP) NO lo usa y conserva el OPcache en memoria compartida de php.ini.
; OJO: conf.d/99-mova.ini (docker/php.ini) se carga DESPUÉS y gana en las claves que repite
; (p. ej. opcache.validate_timestamps = 0, que por tanto también rige aquí).
;
; Por qué: el scheduler (`schedule:work`) y el worker lanzan un `php artisan ...` nuevo cada minuto
; (schedule:run + classmate:send-reminders). Con opcache.enable_cli=0 cada arranque recompila todo
; Laravel (≈ 0,14 s de CPU medidos en local). La caché de archivos reutiliza el bytecode entre
; procesos y baja ese coste ≈ 55-70 %, lo que mantiene la CPU media del scheduler bajo el umbral de
; "activo" de Azure Container Apps (0,01 vCPU) y reduce el costo (docs/azure-cost-optimization.md).
;
; - file_cache_only=1: sin memoria compartida (un proceso CLI efímero no la reutiliza).
; - jit_buffer_size=0: el JIT empeora los procesos de vida corta (medido: 3-4 veces más CPU).
; - El directorio es efímero (/tmp del contenedor): una revisión nueva empieza con la caché vacía.
; - Con validate_timestamps=0 un fichero PHP reescrito dentro del contenedor no se recompila:
;   mismo contrato que el web ("el código no cambia dentro de una imagen"). Un cambio de entorno
;   o de código = revisión nueva, nunca `config:cache` a mano dentro de un contenedor en marcha.
opcache.enable_cli = 1
opcache.file_cache = /tmp/opcache-cli
opcache.file_cache_only = 1
opcache.jit_buffer_size = 0
