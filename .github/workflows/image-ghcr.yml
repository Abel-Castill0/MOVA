# Imagen de producción en GitHub Container Registry (candidata a sustituir al ACR; ver docs/azure-cost-optimization.md §C-3).
#
# NO despliega nada y NO se ejecuta en cada push: solo bajo demanda (Actions → "Run workflow") o al empujar un
# tag `img-*`. Construye con el MISMO Dockerfile que se usa hoy para el ACR y publica
# ghcr.io/<owner>/mova:<sha-corto> más el digest en el resumen del job. Container Apps debe referenciar siempre
# el DIGEST (`@sha256:…`), nunca un tag mutable.
name: Image (GHCR)

on:
  workflow_dispatch:
  push:
    tags: ['img-*']

permissions:
  contents: read
  packages: write

concurrency:
  group: image-ghcr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Nombre de imagen en minúsculas (ghcr.io exige minúsculas)
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mova" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push (sin secretos en el contexto: ver .dockerignore)
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.short }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Digest publicado
        run: |
          {
            echo "### Imagen publicada"
            echo '```'
            echo "${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}"
            echo '```'
            echo "Commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
