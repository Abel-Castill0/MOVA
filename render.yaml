services:
  # ── Web Service (Laravel) ─────────────────────────────────
  - type: web
    name: mova
    runtime: php
    plan: free
    region: oregon
    branch: master
    buildCommand: |
      composer install --no-dev --optimize-autoloader
      npm install
      npm run build
      php artisan config:cache
      php artisan route:cache
      php artisan view:cache
      php artisan storage:link
      php artisan migrate --force
    startCommand: php artisan serve --host=0.0.0.0 --port=$PORT
    envVars:
      - key: APP_NAME
        value: MOVA
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://mova.onrender.com   # cambiar al dominio real
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        fromDatabase:
          name: mova-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: mova-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: mova-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: mova-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: mova-db
          property: password
      - key: QUEUE_CONNECTION
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_DRIVER
        value: database
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.1"
      # Estas variables se configuran manualmente en el dashboard de Render:
      # MAIL_USERNAME, MAIL_PASSWORD, MAIL_FROM_ADDRESS
      # ZOOM_ACCOUNT_ID, ZOOM_CLIENT_ID, ZOOM_CLIENT_SECRET, ZOOM_EMAIL
      # TWILIO_SID, TWILIO_AUTH_TOKEN, TWILIO_WHATSAPP_FROM
      # SENTRY_LARAVEL_DSN

  # ── Queue Worker ──────────────────────────────────────────
  - type: worker
    name: mova-queue
    runtime: php
    plan: free
    region: oregon
    branch: master
    buildCommand: composer install --no-dev --optimize-autoloader
    startCommand: php artisan queue:work --sleep=3 --tries=3 --timeout=60 --max-time=3600

  # ── MySQL Database ────────────────────────────────────────
databases:
  - name: mova-db
    plan: free
    region: oregon
