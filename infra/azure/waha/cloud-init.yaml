#cloud-config
# MOVA - VM de WAHA (piloto). NO contiene secretos: la API key y la clave HMAC se leen del Key Vault con la identidad
# administrada de la VM (solo en el primer arranque; despues pilot-create.sh retira ese permiso).
# pilot-create.sh sustituye los marcadores __...__.
package_update: true
package_upgrade: true
packages:
  - docker.io
  - docker-compose-v2
  - jq
  - curl
  - unattended-upgrades

write_files:
  - path: /etc/waha/waha.conf
    permissions: '0644'
    content: |
      KV_NAME=__KV_NAME__
      WHATSAPP_HOOK_URL=__HOOK_URL__
      SUB_ID=__SUB_ID__
      PILOT_RG=__PILOT_RG__
      EXPIRES_AT=__EXPIRES_AT__

  # -- Secretos: solo si todavia no existen en disco (0600, solo root). Nunca imprime valores. --
  - path: /usr/local/bin/waha-fetch-secrets.sh
    permissions: '0750'
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      [ -s /etc/waha/waha.env ] && exit 0
      . /etc/waha/waha.conf
      TOKEN=$(curl -sf -H 'Metadata:true' 'http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https%3A%2F%2Fvault.azure.net' | jq -r .access_token)
      get() { curl -sf -H "Authorization: Bearer ${TOKEN}" "https://${KV_NAME}.vault.azure.net/secrets/$1?api-version=7.4" | jq -er .value; }
      umask 077
      API_KEY=$(get waha-api-key)
      HMAC_KEY=$(get waha-hook-hmac-key)
      {
        echo "WHATSAPP_API_KEY=${API_KEY}"
        echo "WAHA_API_KEY=${API_KEY}"
        echo "WHATSAPP_HOOK_HMAC_KEY=${HMAC_KEY}"
        echo "WHATSAPP_HOOK_URL=${WHATSAPP_HOOK_URL}"
      } > /etc/waha/waha.env.tmp
      mv /etc/waha/waha.env.tmp /etc/waha/waha.env

  # -- Caducidad de respaldo: al llegar EXPIRES_AT la propia VM borra TODO el grupo de recursos del piloto. --
  # La limpieza principal es EXTERNA (workflow waha-pilot-janitor, no depende de esta VM); esto es una segunda linea.
  # Su identidad solo tiene Contributor sobre ese grupo: no puede tocar nada mas de MOVA (ni el peering: eso lo hace el janitor).
  - path: /usr/local/bin/waha-expire.sh
    permissions: '0750'
    content: |
      #!/usr/bin/env bash
      set -uo pipefail
      . /etc/waha/waha.conf
      [ "$(date +%s)" -lt "${EXPIRES_AT}" ] && exit 0
      logger -t waha-expire "Piloto caducado: eliminando el grupo de recursos ${PILOT_RG}"
      TOKEN=$(curl -sf -H 'Metadata:true' 'http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https%3A%2F%2Fmanagement.azure.com%2F' | jq -r .access_token) || exit 1
      auth=(-H "Authorization: Bearer ${TOKEN}")
      curl -s -m 60 -o /dev/null -w 'resource group delete HTTP %{http_code}\n' -X DELETE "${auth[@]}" "https://management.azure.com/subscriptions/${SUB_ID}/resourcegroups/${PILOT_RG}?api-version=2021-04-01" | logger -t waha-expire

  - path: /etc/systemd/system/waha-expire.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Caducidad de respaldo del piloto de WAHA (borra el grupo de recursos)
      After=network-online.target
      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/waha-expire.sh

  - path: /etc/systemd/system/waha-expire.timer
    permissions: '0644'
    content: |
      [Unit]
      Description=Comprueba cada 5 min si el piloto de WAHA caduco
      [Timer]
      OnBootSec=2min
      OnUnitActiveSec=5min
      Persistent=true
      [Install]
      WantedBy=timers.target

  - path: /opt/waha/docker-compose.yml
    permissions: '0644'
    content: |
      # Una sola sesion (numero dedicado de MOVA). Imagen fijada por version Y digest (nunca `latest`).
      services:
        waha:
          image: devlikeapro/waha:noweb-arm-2026.10.1@sha256:fce6ae58ba819221521b2673704ef9e6d87f98571d67daec62eb737edd77c2c9
          restart: unless-stopped
          env_file: /etc/waha/waha.env
          ports:
            - "3000:3000"            # alcanzable solo desde la red privada (NSG deniega Internet)
          environment:
            WHATSAPP_DEFAULT_ENGINE: NOWEB
            WHATSAPP_START_SESSION: default
            WAHA_DASHBOARD_ENABLED: "false"      # el dashboard NO se expone
            WHATSAPP_SWAGGER_ENABLED: "false"
            WAHA_LOG_LEVEL: info
            WHATSAPP_HOOK_EVENTS: message.ack,session.status,message
            WHATSAPP_HOOK_RETRIES_POLICY: exponential
            WHATSAPP_HOOK_RETRIES_DELAY_SECONDS: "2"
            WHATSAPP_HOOK_RETRIES_ATTEMPTS: "5"
          volumes:
            - /var/lib/waha/sessions:/app/.sessions   # la sesion vinculada persiste aqui (disco de la VM)
          mem_limit: 720m

  - path: /etc/systemd/system/waha.service
    permissions: '0644'
    content: |
      [Unit]
      Description=WAHA (WhatsApp HTTP API) para MOVA
      After=docker.service network-online.target
      Requires=docker.service
      StartLimitIntervalSec=0
      [Service]
      Type=simple
      WorkingDirectory=/opt/waha
      ExecStartPre=/usr/local/bin/waha-fetch-secrets.sh
      ExecStart=/usr/bin/docker compose up
      ExecStop=/usr/bin/docker compose down
      Restart=always
      RestartSec=10
      [Install]
      WantedBy=multi-user.target

runcmd:
  - mkdir -p /var/lib/waha/sessions /etc/waha
  - chmod 700 /var/lib/waha
  # 1 GiB de swap en disco: absorbe picos de memoria sin que el OOM mate a WAHA en una VM de 1 GiB.
  - fallocate -l 1G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile && echo '/swapfile none swap sw 0 0' >> /etc/fstab
  - systemctl daemon-reload
  - systemctl enable --now waha-expire.timer
  - systemctl enable --now waha.service
